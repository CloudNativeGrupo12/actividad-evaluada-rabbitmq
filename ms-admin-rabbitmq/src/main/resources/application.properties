spring.application.name=ms-admin-rabbitmq
server.port=${PORT:8084}
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:reservas}
spring.rabbitmq.password=${RABBIT_PASSWORD:reservas-demo}
spring.rabbitmq.connection-timeout=3s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{25} - %msg%n
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_CLIENT_ID:reservas-api}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
