name: ep3-reservas-publico
x-app: &app
  restart: unless-stopped
  mem_limit: 512m
  env_file: [.env]
  environment: &env
    SPRING_PROFILES_ACTIVE: cloud
    RABBIT_HOST: rabbitmq
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
  depends_on:
    rabbitmq: {condition: service_healthy}
services:
  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mail-data:/data]
  ms-disponibilidad:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.runtime, args: {MODULE: ms-disponibilidad}}
    environment:
      <<: *env
      DB_URL: ${DISPONIBILIDAD_DB_URL}
  ms-reservas:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.runtime, args: {MODULE: ms-reservas}}
    environment:
      <<: *env
      DB_URL: ${RESERVAS_DB_URL}
      DISPONIBILIDAD_URL: http://ms-disponibilidad:8081
    depends_on:
      rabbitmq: {condition: service_healthy}
      ms-disponibilidad: {condition: service_started}
  ms-notificaciones:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.runtime, args: {MODULE: ms-notificaciones}}
    environment:
      <<: *env
      DB_URL: ${NOTIFICACIONES_DB_URL}
      SMTP_HOST: mailpit
  ms-auditoria:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.runtime, args: {MODULE: ms-auditoria}}
    environment:
      <<: *env
      DB_URL: ${AUDITORIA_DB_URL}
  ms-admin-rabbitmq:
    <<: *app
    build: {context: ., dockerfile: Dockerfile.runtime, args: {MODULE: ms-admin-rabbitmq}}
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports: [80:80]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params_ep3:/etc/nginx/proxy_params_ep3:ro
    depends_on:
      ms-reservas: {condition: service_started}
      ms-disponibilidad: {condition: service_started}
      ms-notificaciones: {condition: service_started}
      ms-auditoria: {condition: service_started}
      ms-admin-rabbitmq: {condition: service_started}
volumes:
  rabbit-data:
  mail-data:
