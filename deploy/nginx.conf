server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    location ^~ /backend/reservas/ {
        set $service ms-reservas:8080;
        rewrite ^/backend/reservas/(.*)$ /$1 break;
        proxy_pass http://$service;
        include /etc/nginx/proxy_params_ep3;
    }
    location ^~ /backend/disponibilidad/ {
        set $service ms-disponibilidad:8081;
        rewrite ^/backend/disponibilidad/(.*)$ /$1 break;
        proxy_pass http://$service;
        include /etc/nginx/proxy_params_ep3;
    }
    location ^~ /backend/notificaciones/ {
        set $service ms-notificaciones:8082;
        rewrite ^/backend/notificaciones/(.*)$ /$1 break;
        proxy_pass http://$service;
        include /etc/nginx/proxy_params_ep3;
    }
    location ^~ /backend/auditoria/ {
        set $service ms-auditoria:8083;
        rewrite ^/backend/auditoria/(.*)$ /$1 break;
        proxy_pass http://$service;
        include /etc/nginx/proxy_params_ep3;
    }
    location ^~ /backend/admin/ {
        set $service ms-admin-rabbitmq:8084;
        rewrite ^/backend/admin/(.*)$ /$1 break;
        proxy_pass http://$service;
        include /etc/nginx/proxy_params_ep3;
    }
    location ~ /\. {
        return 404;
    }
    location ~* \.(?:js|css|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
    }
}
